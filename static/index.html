<!DOCTYPE html>
<!--
  এই লাইনটা ব্রাউজারকে বলে দেয় যে এটা HTML5 ফাইল।
  সবসময় ফাইলের প্রথম লাইন এটাই হয়।
-->
<html lang="bn">

<head>
  <!-- meta charset: বাংলা/ইংরেজি সব ভাষার character ঠিকমতো দেখানোর জন্য -->
  <meta charset="UTF-8">
  <!-- viewport: মোবাইল স্ক্রিনে যেন page ঠিকভাবে scale হয় -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word to PDF Converter</title>

  <!--
      style.css ফাইলটাকে link করছি।
      এই ফাইলটা static/style.css তে আছে, backend সেটাকে "/static" পাথে serve করবে
      (main.py তে সেটা কীভাবে হয় সেটা নিচে ব্যাখ্যা করা আছে)
    -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- পুরো app টা একটা "card" এর মধ্যে রাখছি, সুন্দর দেখানোর জন্য -->
  <div class="card">
    <h1>📄 Word ➜ PDF Converter</h1>
    <p class="subtitle">আপনার .docx বা .doc ফাইল আপলোড করুন, PDF হয়ে ডাউনলোড হবে</p>

    <!--
          এখানে একটা "drop zone" বানাচ্ছি — ইউজার হয়তো ফাইল drag করে ছাড়বে,
          বা ক্লিক করে ফাইল বেছে নেবে। id="dropZone" দিয়ে দিলাম কারণ
          script.js থেকে এটাকে খুঁজে বের করে event শোনাতে হবে।
        -->
    <div id="dropZone" class="drop-zone">
      <p id="dropZoneText">এখানে ফাইল টেনে আনুন অথবা ক্লিক করুন</p>

      <!--
              আসল ফাইল সিলেক্ট করার input.
              type="file" দিলে ব্রাউজার নিজে থেকেই "Choose File" বাটন দেখায়।
              accept=".doc,.docx" দিলে file picker এ শুধু Word ফাইল দেখাবে।
              style="display:none" দিয়ে এটাকে লুকিয়ে রাখলাম,
              কারণ আমরা নিজেদের সুন্দর dropZone দেখাচ্ছি — এই input টা লুকানো
              থাকলেও script.js থেকে click করালে এটা কাজ করবে।
            -->
      <input type="file" id="fileInput" accept=".doc,.docx" style="display:none">
    </div>

    <!-- সিলেক্ট করা ফাইলের নাম এখানে দেখাবো -->
    <p id="fileName" class="file-name"></p>

    <!--
          Convert বাটন। প্রথমে disabled রাখছি (button disabled)
          — যতক্ষণ ফাইল সিলেক্ট না হয় ততক্ষণ ক্লিক করা যাবে না।
        -->
    <button id="convertBtn" disabled>Convert to PDF</button>

    <!-- Loading spinner + status text, শুরুতে hidden class দিয়ে লুকানো -->
    <div id="status" class="status hidden">
      <div class="spinner"></div>
      <span id="statusText">Converting...</span>
    </div>

    <!--
          কনভার্সন শেষ হওয়ার পর এখানে একটা "Download PDF" লিংক দেখাবো।
          এটা সাধারণ <a> ট্যাগ — href এ আমরা script.js থেকে blob URL
          বসিয়ে দেব, আর download="..." attribute দিলে ব্রাউজার এটাকে
          লিংকের মতো নতুন ট্যাবে না খুলে সরাসরি ফাইল হিসেবে ডাউনলোড করে।
          class="hidden" দিয়ে শুরুতে লুকানো — convert সফল হলে script.js
          এই class সরিয়ে দেখাবে।
        -->
    <a id="downloadLink" class="download-link hidden" download>
      ⬇️ Download PDF
    </a>

    <!-- এরর মেসেজ দেখানোর জায়গা -->
    <p id="errorMsg" class="error hidden"></p>
  </div>

  <!--
      script.js ফাইলটা page এর একদম শেষে link করছি।
      কেন শেষে? কারণ script.js এর ভেতরের কোড document.getElementById()
      দিয়ে উপরের HTML elements খুঁজবে — তাই আগে HTML পুরোটা load হয়ে
      যাওয়া দরকার, তারপর JS চলা উচিত।
    -->
  <script src="/static/script.js"></script>
</body>

</html>
